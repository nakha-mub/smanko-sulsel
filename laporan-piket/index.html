<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Piket</title>
	<link rel="icon" type="image/png" href="assets/img/Logo SMANKO fix (bg putih).png">
    <style>
        :root {
            --primary-color: #1e3a8a;
            --secondary-color: #3b82f6;
            --bg-color: #f8fafc;
            --text-color: #334155;
            --success-color: #10b981;
            --print-color: #475569;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 98%;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        /* Style Gambar Kop Surat Header */
        .header-logo {
            width: 100%;
            height: auto;
            max-height: 180px;
            object-fit: contain;
            margin-bottom: 20px;
            display: block;
        }

        /* Pembungkus Header & Tombol Action */
        .header-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 15px;
            margin-bottom: 20px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .header-wrapper h2 {
            color: var(--primary-color);
            margin: 0;
            font-size: 1.6rem;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* Tombol Input Laporan Baru */
        .btn-input-nav {
            padding: 10px 20px;
            background-color: var(--success-color);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            transition: background-color 0.3s, transform 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 5px rgba(16, 185, 129, 0.2);
        }

        .btn-input-nav:hover {
            background-color: #059669;
            transform: translateY(-1px);
        }

        /* Tombol Cetak */
        .btn-print {
            padding: 10px 20px;
            background-color: var(--print-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 5px rgba(71, 85, 105, 0.2);
        }

        .btn-print:hover {
            background-color: #334155;
            transform: translateY(-1px);
        }

        /* Form Filter/Pencarian */
        .search-box {
            display: flex;
            gap: 15px;
            margin: 25px 0;
            flex-wrap: wrap;
        }

        .input-group {
            flex: 1;
            min-width: 200px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #64748b;
        }

        input, select {
            padding: 10px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            border-color: var(--secondary-color);
        }

        .btn-search {
            padding: 10px 25px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            align-self: flex-end;
            height: 44px;
            transition: 0.3s;
        }

        .btn-search:hover {
            background-color: var(--secondary-color);
        }

        /* Tabel Data */
        .table-container {
            overflow-x: auto;
            margin-top: 20px;
            height: 300px; 
            overflow-y: auto; 
        }

        .table-container thead th {
            position: sticky;
            top: 0;
            z-index: 10; 
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: var(--primary-color);
            color: white;
            padding: 12px 15px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 0.95rem;
        }

        tr:nth-child(even) { background-color: #f8fafc; }
        tr:hover { background-color: #f1f5f9; }

        .status-msg {
            text-align: center;
            font-weight: bold;
            color: #64748b;
            padding: 30px;
        }

        /* Box Statistik */
        .counter-box {
            display: flex;
            gap: 25px;
            background: #f1f5f9;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            font-size: 1rem;
        }

        @media (max-width: 600px) {
            .header-wrapper {
                flex-direction: column;
                align-items: flex-start;
            }
            .action-buttons {
                width: 100%;
            }
            .btn-input-nav, .btn-print {
                flex: 1;
                justify-content: center;
                box-sizing: border-box;
            }
        }

        /* CSS MEDIA PRINT - DIPERBARUI AGAR HEADER TABEL TETAP BERWARNA */
        @media print {
            body {
                background-color: white;
                padding: 0;
                margin: 0;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            .container {
                width: 100%;
                box-shadow: none;
                padding: 0;
            }

            .header-logo {
                max-height: none;
                margin-bottom: 10px;
            }

            .action-buttons, .search-box, .btn-search, #statusMsg {
                display: none !important;
            }

            .header-wrapper {
                border-bottom: 2px solid #000;
                margin-bottom: 10px;
            }

            .header-wrapper h2 {
                color: black;
                font-size: 1.4rem;
                text-align: center;
                width: 100%;
            }

            .table-container {
                height: auto !important;
                overflow: visible !important;
            }

            table {
                width: 100%;
                border-collapse: collapse;
            }

            th, td {
                border: 1px solid #333 !important;
                padding: 6px 8px !important;
                font-size: 0.8rem !important;
            }

            /* PAKSA WARNA HEADER TABEL TETAP SESUAI TAMPILAN WEB */
            th {
                background-color: var(--primary-color) !important;
                color: white !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            td {
                color: black !important;
            }

            tr:nth-child(even) {
                background-color: transparent !important;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Gambar Header Kop Surat SMANKO -->
    <img src="assets/img/Header.jpg" alt="Header SMANKO Sulsel" class="header-logo">

    <div class="header-wrapper">
        <h2>Laporan Piket <span id="filterK"></span></h2>
        <div class="action-buttons">
            <button onclick="cetakLaporan()" class="btn-print">🖨️ Cetak Hasil Filter</button>
            <a href="InputGuruPiket.html" class="btn-input-nav">➔ Input Laporan Baru</a>
        </div>
    </div>
    
    <div class="search-box">
        <div class="input-group">
            <label for="kelas_nama_nis">Kelas - Nama Siswa - NIS</label>
            <select id="kelas_nama_nis" onchange="filterData()">
                <option value="">Memuat data...</option>
            </select>
        </div>
        <div class="input-group">
            <label for="keterangan">Keterangan</label>
            <select id="keterangan" onchange="filterData()">
                <option value="">-- Semua --</option>
                <option value="Terlambat">Terlambat</option>
                <option value="Telat (Izin)">Terlambat (Izin)</option>
                <option value="Izin Keluar">Izin Keluar</option>
                <option value="Langgar Sepatu">Pelanggaran Sepatu</option>
                <option value="Langgar Baju">Pelanggaran Baju</option>
                <option value="Langgar Celana-Rok">Pelanggaran Celana/Rok</option>
                <option value="Langgar Rambut-Jilbab">Pelanggaran Rambut/Jilbab</option>
            </select>
        </div>
        <div class="input-group">
            <label for="tanggal">Tanggal</label>
            <input type="date" id="tanggal" onchange="filterData()">
        </div>
        <button class="btn-search" onclick="filterData()">Cari</button>
    </div>

    <div class="search-box">
        <div class="input-group" id="jumlah" style="display: none; text-align: center;">
            <big><b><span id="jmlsemua"></span><span id="jml1"></span><span id="jml2"></span><span id="jml3"></span></b></big>
        </div>
    </div>

    <div id="statusMsg" class="status-msg">Menghubungkan ke database spreadsheet...</div>
    
    <div class="table-container">
        <table id="dataTable" style="display: none;">
            <thead>
                <tr>
                    <th>No</th>
                    <th>NIS</th>
                    <th>Nama Lengkap</th>
                    <th>Kelas</th>
                    <th>Jenis Kelamin</th>
                    <th>Cabang Olahraga</th>
                    <th>Hari, Tanggal</th>
                    <th>Waktu</th>
                    <th>Keterangan</th>
                    <th>Catatan</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    const webAppUrl = 'https://script.google.com/macros/s/AKfycbxb4lW4ROLAEGGH-e4WHstHukmfC4zjNVjFznltlcr1_DlKXsp5O4nSgLTgd3OIckO4WQ/exec';
    
    let semuaSiswa = [];

    async function ambilDataAwal() {
        try {
            const response = await fetch(webAppUrl);
            semuaSiswa = await response.json();
            
            document.getElementById('statusMsg').style.display = 'none';
            tampilkanKeTabel(semuaSiswa);
        } catch (error) {
            console.error('Error:', error);
            const status = document.getElementById('statusMsg');
            status.innerText = 'Gagal memuat data. Periksa URL Apps Script Anda atau koneksi internet.';
            status.style.color = '#ef4444';
        }
    }
	
    function buatWaktu(isoString) {
        if(!isoString) return "-";
        const tanggalObjek = new Date(isoString);
        const jamLokal = String(tanggalObjek.getHours()).padStart(2, '0');
        const menitLokal = String(tanggalObjek.getMinutes()).padStart(2, '0');
        const detikLokal = String(tanggalObjek.getSeconds()).padStart(2, '0');
        return `${jamLokal}:${menitLokal}:${detikLokal}`;
    }
	
    function buatTanggal(isoString) {
        if(!isoString) return "-";
        const dateObj = new Date(isoString);
        const tahun = dateObj.getFullYear();
        const bulan = String(dateObj.getMonth() + 1).padStart(2, '0');
        const tanggal = String(dateObj.getDate()).padStart(2, '0');
        const bulanIndonesia = dateObj.toLocaleString('id-ID', { month: 'long' });
        return `${tanggal} ${bulanIndonesia} ${tahun}`;
    }
	
    function buatTanggal1(isoString) {
        if(!isoString) return "";
        const dateObj = new Date(isoString);
        const tahun = dateObj.getFullYear();
        const bulan = String(dateObj.getMonth() + 1).padStart(2, '0');
        const tanggal = String(dateObj.getDate()).padStart(2, '0');
        return `${tahun}-${bulan}-${tanggal}`;
    }
	
    function buatHari(isoString) {
        if(!isoString) return "-";
        const dateObj = new Date(isoString);
        return dateObj.toLocaleString('id-ID', { weekday: 'long' });
    }

    function updateLabelFilter() {
        const selectSiswa = document.getElementById('kelas_nama_nis');
        const valSiswa = selectSiswa.value;
        const textSiswa = selectSiswa.options[selectSiswa.selectedIndex]?.text || '';

        const valKet = document.getElementById('keterangan').value;
        const valTgl = document.getElementById('tanggal').value;

        let teksHasil = [];

        if (valSiswa !== "") {
            teksHasil.push(`[${textSiswa}]`);
        }

        if (valKet !== "") {
            teksHasil.push(`[Keterangan: ${valKet}]`);
        }

        if (valTgl !== "") {
            const parts = valTgl.split('-');
            if (parts.length === 3) {
                const tglObj = new Date(parts[0], parts[1] - 1, parts[2]);
                const hariStr = buatHari(tglObj);
                const tglStr = buatTanggal(tglObj);
                teksHasil.push(`[${hariStr}, ${tglStr}]`);
            }
        }

        const spanFilter = document.getElementById('filterK');
        if (teksHasil.length > 0) {
            const teksGabungan = teksHasil.join(" ");
            spanFilter.innerText = " - " + teksGabungan;
            document.title = "Laporan Piket - " + teksGabungan;
        } else {
            spanFilter.innerText = "";
            document.title = "Laporan Piket";
        }
    }

    function tampilkanKeTabel(dataData) {
        const tableBody = document.getElementById('tableBody');
        const tableElement = document.getElementById('dataTable');
        const statusMsg = document.getElementById('statusMsg');
        const jumlahBox = document.getElementById('jumlah');

        tableBody.innerHTML = '';

        if (dataData.length === 0) {
            tableElement.style.display = 'none';
            statusMsg.style.display = 'block';
            statusMsg.innerText = 'Data siswa tidak ditemukan.';
            jumlahBox.style.display = 'none';
            return;
        } else {
            if (document.getElementById('kelas_nama_nis').value === "") {
                jumlahBox.style.display = 'none';
            } else {
                jumlahBox.style.display = 'block';
                document.getElementById('jmlsemua').style.display = 'block';
                const ket = document.getElementById('keterangan').value;
                document.getElementById('jml1').style.display = (ket === "Terlambat") ? 'block' : 'none';
                document.getElementById('jml2').style.display = (ket === "Telat (Izin)") ? 'block' : 'none';
                document.getElementById('jml3').style.display = (ket === "Izin Keluar") ? 'block' : 'none';
            }
        }

        statusMsg.style.display = 'none';
        tableElement.style.display = 'table';
        var i = 0;
        dataData.forEach(siswa => {
            i++;
            const row = document.createElement('tr');
            var jk = (siswa.jenis_kelamin === "L") ? "Laki-laki" : "Perempuan";
            
            row.innerHTML = `
                <td>${i}</td>
                <td>${siswa.nis || '-'}</td>
                <td>${siswa.nama || '-'}</td>
                <td>${siswa.kelas || '-'}</td>
                <td>${jk}</td>
                <td>${siswa.cabor || '-'}</td>
                <td>${buatHari(siswa.tanggal)}, ${buatTanggal(siswa.tanggal)}</td>
                <td>${buatWaktu(siswa.waktu)}</td>
                <td>${siswa.keterangan || '-'}</td>
                <td>${siswa.catatan || '-'}</td>
            `;
            tableBody.appendChild(row);
            
            var jsm = (siswa.terlambat || 0) + (siswa.telat_izin || 0) + (siswa.izin_keluar || 0);
            document.getElementById('jmlsemua').innerText = "Jumlah Semua: " + jsm;
            document.getElementById('jml1').innerText = " | Jumlah Terlambat: " + (siswa.terlambat || 0);
            document.getElementById('jml2').innerText = " | Jumlah Terlambat dengan Izin: " + (siswa.telat_izin || 0);
            document.getElementById('jml3').innerText = " | Jumlah Izin Keluar: " + (siswa.izin_keluar || 0);
        });
    }

    function filterData() {
        const input1 = document.getElementById('kelas_nama_nis').value.toLowerCase().trim();
        const input2 = document.getElementById('keterangan').value.toLowerCase().trim();
        const inputTanggal = document.getElementById('tanggal').value;

        updateLabelFilter();

        const hasilFilter = semuaSiswa.filter(siswa => {
            const dataGabung = `${siswa.kelas_nama_nis} ${siswa.nisn} ${siswa.nis} ${siswa.nama} ${siswa.kelas}`.toLowerCase();
            const keteranganSiswa = (siswa.keterangan || '').toLowerCase().trim();

            const cocok1 = dataGabung.includes(input1);
            const cocok2 = input2 === "" || keteranganSiswa.includes(input2);
			
            let cocokTanggal = true; 
            if (inputTanggal) {
                cocokTanggal = (buatTanggal1(siswa.tanggal) === inputTanggal);
            }

            return cocok1 && cocok2 && cocokTanggal;
        });

        tampilkanKeTabel(hasilFilter);
    }

    function cetakLaporan() {
        const tableBody = document.getElementById('tableBody');
        if (!tableBody || tableBody.children.length === 0) {
            alert("Tidak ada data hasil filter yang bisa dicetak.");
            return;
        }
        window.print();
    }

    window.onload = ambilDataAwal;
</script>

<script src="option-kelas-nama-nis.js"></script>

</body>
</html>
