<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencarian Data Siswa - Laporan Piket</title>
    <style>
        :root {
            --primary-color: #1e3a8a;
            --secondary-color: #3b82f6;
            --bg-color: #f8fafc;
            --text-color: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            /*max-width: 900px;*/
            width: 98%;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        h2 {
            color: var(--primary-color);
            margin-top: 0;
            text-align: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 15px;
        }

        /* Form Filter/Pencarian */
        .search-box {
            display: flex;
            gap: 15px;
            margin: 25px 0;
            flex-wrap: wrap;
        }

        .input-group {
            flex: 1;
            min-width: 200px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #64748b;
        }

        input, select {
            padding: 10px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            border-color: var(--secondary-color);
        }

        .btn-search {
            padding: 10px 25px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            align-self: flex-end;
            height: 44px;
            transition: 0.3s;
        }

        .btn-search:hover {
            background-color: var(--secondary-color);
        }

        /* Tabel Data */
        .table-container {
            overflow-x: auto;
            margin-top: 20px;
			height: 300px; /* Sesuaikan tinggi tabel Anda */
			overflow-y: auto; /* Memunculkan scrollbar vertikal */
		}

		/* Kunci agar thead tetap diam */
		.table-container thead th {
		  position: sticky;
		  top: 0;
		  z-index: 10; /* Agar posisinya selalu berada di atas teks lainnya */
		}

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: var(--primary-color);
            color: white;
            padding: 12px 15px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 0.95rem;
        }

        tr:nth-child(even) { background-color: #f8fafc; }
        tr:hover { background-color: #f1f5f9; }

        .status-msg {
            text-align: center;
            font-weight: bold;
            color: #64748b;
            padding: 30px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Pencarian Data Siswa - Laporan Piket</h2>
    
    <div class="search-box">
        <div class="input-group">
            <label for="searchNama">Kelas - Nama Siswa - NIS</label>
            <!--<input type="text" id="searchNama" placeholder="Ketik nama siswa...">-->
			<select id="kelas_nama_nis" onchange="filterData()">
					<option value="">Memuat data...</option>
				</select>
        </div>
        <div class="input-group">
            <label for="searchKelas">Keterangan</label>
            <!--<input type="text" id="searchKelas" placeholder="Ketik kelas (Contoh: X A, 12, dll)...">-->
			<select id="keterangan" onchange="filterData()">
				<option value="">-- Semua --</option>
				<option value="Terlambat">Terlambat</option>
				<option value="Telat (Izin)">Terlambat (Izin)</option>
				<option value="Izin Keluar">Izin Keluar</option>
			</select>
        </div>
		<div class="input-group">
            <label for="searchNama">Tanggal</label>
            <input type="date" id="tanggal" placeholder="Ketik nama siswa..." onchange="filterData()">
        </div>
        <button class="btn-search" onclick="filterData()">Cari</button>
    </div>
	<div class="search-box">
		<div class="input-group" id="jumlah" style="display: none; text-align: center;"><big><b><span id="jmlsemua"></span><span id="jml1"></span><span id="jml2"></span><span id="jml3"></span></b></big></div>
	</div>

    <div id="statusMsg" class="status-msg">Menghubungkan ke database spreadsheet...</div>
    
    <div class="table-container">
        <table id="dataTable" style="display: none;">
            <thead>
                <tr>
                    <th>No</th>
                    <th>NIS</th>
                    <th>Nama Lengkap</th>
                    <th>Kelas</th>
					<th>Jenis Kelamin</th>
					<th>Cabang Olahraga</th>
					<th>Hari, Tanggal</th>
					<th>Waktu</th>
					<th>Keterangan</th>
					<th>Catatan</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    // MASUKKAN URL APLIKASI WEB GOOGLE APPS SCRIPT ANDA DI SINI
    const webAppUrl = 'https://script.google.com/macros/s/AKfycbxb4lW4ROLAEGGH-e4WHstHukmfC4zjNVjFznltlcr1_DlKXsp5O4nSgLTgd3OIckO4WQ/exec';
    
    let semuaSiswa = []; // Tempat menyimpan data lokal dari database asli

    // Mengambil data pertama kali saat website dibuka
    async function ambilDataAwal() {
        try {
            const response = await fetch(webAppUrl);
            semuaSiswa = await response.json();
            
            document.getElementById('statusMsg').style.display = 'none';
            // Tampilkan seluruh data siswa secara default di awal
            tampilkanKeTabel(semuaSiswa);
        } catch (error) {
            console.error('Error:', error);
            const status = document.getElementById('statusMsg');
            status.innerText = 'Gagal memuat data. Periksa URL Apps Script Anda atau koneksi internet.';
            status.style.color = '#ef4444';
        }
    }
	
	//Fungsi waktu
	function buatWaktu(isoString) {
		const tanggalObjek = new Date(isoString);

		//mengambil waktu berdasarkan Waktu Lokal PC/User:
		const jamLokal = String(tanggalObjek.getHours()).padStart(2, '0');
		const menitLokal = String(tanggalObjek.getMinutes()).padStart(2, '0');
		const detikLokal = String(tanggalObjek.getSeconds()).padStart(2, '0');

		var as = `${jamLokal}:${menitLokal}:${detikLokal}`;
		return as;
	}
	
	//Fungsi Tanggal
	function buatTanggal(isoString) {
		const dateObj = new Date(isoString);

		// Mengambil tanggal, bulan, dan tahun berdasarkan Zona Waktu Lokal
		const tahun = dateObj.getFullYear();
		// getMonth() dimulai dari 0, jadi perlu ditambah 1. padStart memastikan ada 2 digit.
		const bulan = String(dateObj.getMonth() + 1).padStart(2, '0');
		const tanggal = String(dateObj.getDate()).padStart(2, '0');
		const bulanIndonesia = dateObj.toLocaleString('id-ID', { month: 'long' });

		// Format standar (YYYY-MM-DD)
		const tanggalLokal = `${tanggal} ${bulanIndonesia} ${tahun}`;
		return tanggalLokal;
	}
	
	//Fungsi Tanggal1
	function buatTanggal1(isoString) {
		const dateObj = new Date(isoString);

		// Mengambil tanggal, bulan, dan tahun berdasarkan Zona Waktu Lokal
		const tahun = dateObj.getFullYear();
		// getMonth() dimulai dari 0, jadi perlu ditambah 1. padStart memastikan ada 2 digit.
		const bulan = String(dateObj.getMonth() + 1).padStart(2, '0');
		const tanggal = String(dateObj.getDate()).padStart(2, '0');
		const bulanIndonesia = dateObj.toLocaleString('id-ID', { month: 'long' });

		// Format standar (YYYY-MM-DD)
		const tanggalLokal = `${tahun}-${bulan}-${tanggal}`;
		return tanggalLokal;
	}
	
	//Fungsi Hari
	function buatHari(isoString) {
		const dateObj = new Date(isoString);

		// Mengambil nama hari sesuai zona waktu LOKAL komputer user
		const hariLokal = dateObj.toLocaleString('id-ID', { weekday: 'long' });
		return hariLokal;
	}

    // Fungsi untuk merender/menulis data array ke tabel HTML
    function tampilkanKeTabel(dataData) {
        const tableBody = document.getElementById('tableBody');
        const tableElement = document.getElementById('dataTable');
        const statusMsg = document.getElementById('statusMsg');

        tableBody.innerHTML = '';

        if (dataData.length === 0) {
            tableElement.style.display = 'none';
            statusMsg.style.display = 'block';
            statusMsg.innerText = 'Data siswa tidak ditemukan.';
			document.getElementById('jumlah').style.display = 'none';
            return;
        } else {
			if (document.getElementById('kelas_nama_nis').value === "") {
				jumlah.style.display = 'none';
			} else {
				jumlah.style.display = 'block';
				jmlsemua.style.display = 'block';
				if(document.getElementById('keterangan').value === "Terlambat") {
					jml1.style.display = 'block';
					jml2.style.display = 'none';
					jml3.style.display = 'none';
				} else if(document.getElementById('keterangan').value === "Telat (Izin)") {
					jml1.style.display = 'none';
					jml2.style.display = 'block';
					jml3.style.display = 'none';
				} else if(document.getElementById('keterangan').value === "Izin Keluar") {
					jml1.style.display = 'none';
					jml2.style.display = 'none';
					jml3.style.display = 'block';
				} else {
					jml1.style.display = 'none';
					jml2.style.display = 'none';
					jml3.style.display = 'none';
				}
			}
		}

        statusMsg.style.display = 'none';
        tableElement.style.display = 'table';
		var i = 0;
        dataData.forEach(siswa => {
			i = i+1;
            const row = document.createElement('tr');
            var jk = "";
			if (siswa.jenis_kelamin === "L") {
				jk = "Laki-laki";
			} else {
				jk = "Perempuan";
			}
            // PENTING: Nama properti (siswa.nama, siswa.kelas, dsb) harus menggunakan HURUF KECIL SEMUA
            // sesuai nama kolom header di Google Spreadsheet Anda.
            row.innerHTML = `
                <td>${i || '-'}</td>
				<td>${siswa.nis || '-'}</td>
                <td>${siswa.nama || '-'}</td>
                <td>${siswa.kelas || '-'}</td>
				<td>${jk || '-'}</td>
				<td>${siswa.cabor || '-'}</td>
				<td>${buatHari(siswa.tanggal) || '-'}, ${buatTanggal(siswa.tanggal) || '-'}</td>
				<td>${buatWaktu(siswa.waktu) || '-'}</td>
				<td>${siswa.keterangan || '-'}</td>
				<td>${siswa.catatan || '-'}</td>
            `;
			console.log(siswa.tanggal);
            tableBody.appendChild(row);
			var jsm = siswa.terlambat+siswa.telat_izin+siswa.izin_keluar;
			document.getElementById('jmlsemua').innerText = "Jumlah Semua:  "+jsm;
			document.getElementById('jml1').innerText = "Jumlah Terlambat: "+siswa.terlambat;
			document.getElementById('jml2').innerText = "Jumlah Terlambat dengan Izin: "+siswa.telat_izin;
			document.getElementById('jml3').innerText = "Jumlah Izin Keluar: "+siswa.izin_keluar;
        });
    }

    // Fungsi Filter Pencarian secara fleksibel berdasarkan Nama dan/atau Kelas
    function filterData() {
		// Mengambil nilai dari input pencarian
		const input1 = document.getElementById('kelas_nama_nis').value.toLowerCase().trim();
		const input2 = document.getElementById('keterangan').value.toLowerCase().trim();
		const inputTanggal = document.getElementById('tanggal').value; // Menghasilkan format YYYY-MM-DD

		const hasilFilter = semuaSiswa.filter(siswa => {
			// Gabungkan kolom data pendaftar agar pencarian text lebih luas dan tidak sensitif huruf kapital
			const dataGabung = `${siswa.kelas_nama_nis} ${siswa.nisn} ${siswa.nis} ${siswa.nama} ${siswa.kelas}`.toLowerCase();
			const keteranganSiswa = (siswa.keterangan || '').toLowerCase().trim();

			// 1. Cocokkan Kelas/Nama/NIS
			const cocok1 = dataGabung.includes(input1);
			
			// 2. Cocokkan Keterangan
			const cocok2 = input2 === "" || keteranganSiswa.includes(input2);
			
			// 3. Cocokkan Tanggal (Logika Baru)
			let cocokTanggal = true; 
			if (inputTanggal) {
				const tglSiswaRaw = siswa.tanggal || ''; // Ambil data tanggal dari spreadsheet (Format: M/D/YYYY)
				cocokTanggal = (buatTanggal1(tglSiswaRaw) === inputTanggal);
				/*const parts = tglSiswaRaw.split('/');
				
				if (parts.length === 3) {
					// Ubah format M/D/YYYY dari Sheets menjadi YYYY-MM-DD agar sama dengan input HTML
					const bulan = parts[0].padStart(2, '0');
					const hari = parts[1].padStart(2, '0');
					const tahun = parts[2];
					const tglSiswaFormatted = `${tahun}-${bulan}-${hari}`;
					
					cocokTanggal = (tglSiswaFormatted === inputTanggal);
				} else {
					cocokTanggal = false; // Jika format tanggal di sheet tidak sesuai standar M/D/YYYY
				}*/
			}

			// Mengharuskan semua kondisi yang diisi bernilai cocok (TRUE)
			return cocok1 && cocok2 && cocokTanggal;
		});

		tampilkanKeTabel(hasilFilter);
	}

    // Fitur pemicu tombol "Enter" saat mengetik di kolom input pencarian
    //document.getElementById('kelas_nama_nis').addEventListener('change', e => { if(e.key === 'Enter') filterData(); });
    //document.getElementById('keterangan').addEventListener('change', e => { if(e.key === 'Enter') filterData(); });
	
	
	

    // Jalankan penarikan data otomatis saat halaman selesai dimuat
    window.onload = ambilDataAwal;
</script>

<script src="option-kelas-nama-nis.js"></script>

</body>
</html>
