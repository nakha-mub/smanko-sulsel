<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencarian Data Siswa - Laporan Piket</title>
    <style>
        :root {
            --primary-color: #1e3a8a;
            --secondary-color: #3b82f6;
            --bg-color: #f8fafc;
            --text-color: #334155;
            --success-color: #10b981;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 98%;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        /* CSS BARU: Pembungkus Header & Tombol Input */
        .header-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 15px;
            margin-bottom: 20px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .header-wrapper h2 {
            color: var(--primary-color);
            margin: 0;
            font-size: 1.6rem;
        }

        /* CSS BARU: Tombol Input Laporan Baru */
        .btn-input-nav {
            padding: 10px 20px;
            background-color: var(--success-color);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            transition: background-color 0.3s, transform 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 5px rgba(16, 185, 129, 0.2);
        }

        .btn-input-nav:hover {
            background-color: #059669;
            transform: translateY(-1px);
        }

        /* Form Filter/Pencarian */
        .search-box {
            display: flex;
            gap: 15px;
            margin: 25px 0;
            flex-wrap: wrap;
        }

        .input-group {
            flex: 1;
            min-width: 200px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #64748b;
        }

        input, select {
            padding: 10px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            border-color: var(--secondary-color);
        }

        .btn-search {
            padding: 10px 25px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            align-self: flex-end;
            height: 44px;
            transition: 0.3s;
        }

        .btn-search:hover {
            background-color: var(--secondary-color);
        }

        /* Tabel Data */
        .table-container {
            overflow-x: auto;
            margin-top: 20px;
			height: 300px; /* Sesuaikan tinggi tabel Anda */
			overflow-y: auto; /* Memunculkan scrollbar vertikal */
		}

		/* Kunci agar thead tetap diam */
		.table-container thead th {
		  position: sticky;
		  top: 0;
		  z-index: 10; /* Agar posisinya selalu berada di atas teks lainnya */
		}

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: var(--primary-color);
            color: white;
            padding: 12px 15px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 0.95rem;
        }

        tr:nth-child(even) { background-color: #f8fafc; }
        tr:hover { background-color: #f1f5f9; }

        .status-msg {
            text-align: center;
            font-weight: bold;
            color: #64748b;
            padding: 30px;
        }

        /* Box Statistik */
        .counter-box {
            display: flex;
            gap: 25px;
            background: #f1f5f9;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            font-size: 1rem;
        }
        .counter-item {
            font-weight: bold;
            color: var(--primary-color);
        }

        @media (max-width: 600px) {
            .header-wrapper {
                flex-direction: column;
                align-items: flex-start;
            }
            .btn-input-nav {
                width: 100%;
                justify-content: center;
                box-sizing: border-box;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-wrapper">
        <h2>Pencarian Data Siswa - Laporan Piket</h2>
        <a href="InputGuruPiket.html" class="btn-input-nav">➔ Input Laporan Baru</a>
    </div>
    
    <div class="search-box">
        <div class="input-group">
            <label for="kelas_nama_nis">Kelas - Nama Siswa - NIS</label>
            <select id="kelas_nama_nis" onchange="filterData()">
                <option value="">Memuat data...</option>
            </select>
        </div>
        <div class="input-group">
            <label for="keterangan">Keterangan</label>
            <select id="keterangan" onchange="filterData()">
                <option value="">-- Semua --</option>
                <option value="Terlambat">Terlambat</option>
                <option value="Telat (Izin)">Terlambat (Izin)</option>
                <option value="Izin Keluar">Izin Keluar</option>
            </select>
        </div>
        <div class="input-group">
            <label for="tanggal">Tanggal</label>
            <input type="date" id="tanggal" onchange="filterData()">
        </div>
        <button class="btn-search" onclick="filterData()">Cari</button>
    </div>

    <div class="counter-box" id="jumlah" style="display: none;">
        <div class="counter-item" id="jmlsemua"></div>
        <div class="counter-item" id="jml1"></div>
        <div class="counter-item" id="jml2"></div>
        <div class="counter-item" id="jml3"></div>
    </div>

    <div id="statusMsg" class="status-msg">Menghubungkan ke database spreadsheet...</div>
    
    <div class="table-container">
        <table id="dataTable" style="display: none;">
            <thead>
                <tr>
                    <th>No</th>
                    <th>NIS</th>
                    <th>Nama Lengkap</th>
                    <th>Kelas</th>
                    <th>Hari, Tanggal</th>
                    <th>Waktu</th>
                    <th>Keterangan</th>
                    <th>Catatan</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    const webAppUrl = 'https://script.google.com/macros/s/AKfycbxb4lW4ROLAEGGH-e4WHstHukmfC4zjNVjFznltlcr1_DlKXsp5O4nSgLTgd3OIckO4WQ/exec';
    let semuaSiswa = []; 

    async function ambilDataAwal() {
        try {
            const response = await fetch(webAppUrl);
            semuaSiswa = await response.json();
            document.getElementById('statusMsg').style.display = 'none';
            tampilkanKeTabel(semuaSiswa);
        } catch (error) {
            console.error('Error:', error);
            const status = document.getElementById('statusMsg');
            status.innerText = 'Gagal memuat data. Periksa URL Apps Script Anda.';
            status.style.color = '#ef4444';
        }
    }
    
    function buatWaktu(isoString) {
        if(!isoString) return "-";
        const tanggalObjek = new Date(isoString);
        const jamLokal = String(tanggalObjek.getHours()).padStart(2, '0');
        const menitLokal = String(tanggalObjek.getMinutes()).padStart(2, '0');
        const detikLokal = String(tanggalObjek.getSeconds()).padStart(2, '0');
        return `${jamLokal}:${menitLokal}:${detikLokal}`;
    }
    
    function buatTanggal(isoString) {
        if(!isoString) return "-";
        const dateObj = new Date(isoString);
        const tahun = dateObj.getFullYear();
        const tanggal = String(dateObj.getDate()).padStart(2, '0');
        const bulanIndonesia = dateObj.toLocaleString('id-ID', { month: 'long' });
        return `${tanggal} ${bulanIndonesia} ${tahun}`;
    }
    
    function buatTanggal1(isoString) {
        if(!isoString) return "";
        const dateObj = new Date(isoString);
        const tahun = dateObj.getFullYear();
        const bulan = String(dateObj.getMonth() + 1).padStart(2, '0');
        const tanggal = String(dateObj.getDate()).padStart(2, '0');
        return `${tahun}-${bulan}-${tanggal}`;
    }
    
    function buatHari(isoString) {
        if(!isoString) return "-";
        const dateObj = new Date(isoString);
        return dateObj.toLocaleString('id-ID', { weekday: 'long' });
    }

    function tampilkanKeTabel(dataData) {
        const tableBody = document.getElementById('tableBody');
        const tableElement = document.getElementById('dataTable');
        const statusMsg = document.getElementById('statusMsg');
        const jumlahBox = document.getElementById('jumlah');

        tableBody.innerHTML = '';

        if (dataData.length === 0) {
            tableElement.style.display = 'none';
            statusMsg.style.display = 'block';
            statusMsg.innerText = 'Data siswa tidak ditemukan.';
            jumlahBox.style.display = 'none';
            return;
        }

        const filterSiswa = document.getElementById('kelas_nama_nis').value;
        const filterKet = document.getElementById('keterangan').value;

        if (filterSiswa === "") {
            jumlahBox.style.display = 'none';
        } else {
            jumlahBox.style.display = 'flex';
            const siswaAwal = dataData[0];
            const jsm = (siswaAwal.terlambat || 0) + (siswaAwal.telat_izin || 0) + (siswaAwal.izin_keluar || 0);
            
            document.getElementById('jmlsemua').innerText = "Total Pelanggaran: " + jsm;
            document.getElementById('jml1').innerText = "Terlambat: " + (siswaAwal.terlambat || 0);
            document.getElementById('jml2').innerText = "Terlambat (Izin): " + (siswaAwal.telat_izin || 0);
            document.getElementById('jml3').innerText = "Izin Keluar: " + (siswaAwal.izin_keluar || 0);

            document.getElementById('jml1').style.display = (filterKet === "" || filterKet === "Terlambat") ? "block" : "none";
            document.getElementById('jml2').style.display = (filterKet === "" || filterKet === "Telat (Izin)") ? "block" : "none";
            document.getElementById('jml3').style.display = (filterKet === "" || filterKet === "Izin Keluar") ? "block" : "none";
        }

        statusMsg.style.display = 'none';
        tableElement.style.display = 'table';
        
        let i = 0;
        dataData.forEach(siswa => {
            i++;
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${i}</td>
                <td>${siswa.nis || '-'}</td>
                <td>${siswa.nama || '-'}</td>
                <td>${siswa.kelas || '-'}</td>
                <td>${buatHari(siswa.tanggal)}, ${buatTanggal(siswa.tanggal)}</td>
                <td>${buatWaktu(siswa.waktu)}</td>
                <td>${siswa.keterangan || '-'}</td>
                <td>${siswa.catatan || '-'}</td>
            `;
            tableBody.appendChild(row);
        });
    }

    function filterData() {
        const input1 = document.getElementById('kelas_nama_nis').value.toLowerCase().trim();
        const input2 = document.getElementById('keterangan').value.toLowerCase().trim();
        const inputTanggal = document.getElementById('tanggal').value;

        const hasilFilter = semuaSiswa.filter(siswa => {
            const dataGabung = (siswa.kelas_nama_nis || '');
            const keteranganSiswa = (siswa.keterangan || '').toLowerCase().trim();

            const cocok1 = input1 === "" || dataGabung.includes(input1);
            const cocok2 = input2 === "" || keteranganSiswa.includes(input2);
            
            let cocokTanggal = true; 
            if (inputTanggal) {
                cocokTanggal = (buatTanggal1(siswa.tanggal) === inputTanggal);
            }

            return cocok1 && cocok2 && cocokTanggal;
        });

        tampilkanKeTabel(hasilFilter);
    }

    window.onload = ambilDataAwal;
</script>
<script src="option-kelas-nama-nis.js"></script>
</body>
</html>
