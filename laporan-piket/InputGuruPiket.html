<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Data Piket Guru - SMANKO</title>
	<link rel="icon" type="image/png" href="assets/img/Logo SMANKO fix (bg putih).png">
    <style>
        :root {
            --primary-color: #1e3a8a;
            --secondary-color: #3b82f6;
            --bg-color: #f1f5f9;
            --text-color: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .form-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 650px;
        }

        /* CSS BARU: Pembungkus Judul & Tombol Navigasi */
        .header-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 12px;
            margin-bottom: 25px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .header-wrapper h2 {
            margin: 0;
            color: var(--primary-color);
            font-size: 1.4rem;
        }

        /* CSS BARU: Tombol Tampilkan Data */
        .btn-view-nav {
            padding: 10px 18px;
            background-color: var(--secondary-color);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
            transition: background-color 0.3s, transform 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 5px rgba(59, 130, 246, 0.15);
        }

        .btn-view-nav:hover {
            background-color: var(--primary-color);
            transform: translateY(-1px);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 15px;
        }

        .full-width {
            grid-column: span 2;
        }

        label {
            font-size: 0.9rem;
            font-weight: 600;
            color: #475569;
        }

        input, select, textarea {
            padding: 10px;
            border: 2px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--secondary-color);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: var(--secondary-color);
        }

        button:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        #statusMsg {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            display: none;
            text-align: center;
            font-weight: bold;
        }
        .success { background-color: #d1fae5; color: #065f46; }
        .error { background-color: #fee2e2; color: #991b1b; }

        /* Responsif layout HP */
        @media (max-width: 600px) {
            .header-wrapper {
                flex-direction: column;
                align-items: flex-start;
            }
            .btn-view-nav {
                width: 100%;
                justify-content: center;
                box-sizing: border-box;
            }
            .form-grid { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
        }
    </style>
</head>
<body>

<div class="form-container">
    <div class="header-wrapper">
        <h2>Laporan Piket Guru / Siswa Terlambat</h2>
        <a href="index.html" class="btn-view-nav">📋 Tampilkan Data</a>
    </div>

    <form id="piketForm">
        <div class="form-grid">
            <div class="input-group full-width">
                <label for="kelas_nama_nis">Nama Lengkap Siswa</label>
                <select id="kelas_nama_nis">
                    <option value="">Memuat data...</option>
                </select>
            </div>

            <div class="input-group full-width">
                <label for="keterangan">Keterangan Pelanggaran</label>
                <select id="keterangan">
                    <option value="">-- Pilih Salah Satu --</option>
                    <option value="Terlambat">Terlambat</option>
                    <option value="Telat (Izin)">Terlambat (Izin)</option>
                    <option value="Izin Keluar">Izin Keluar</option>
                </select>
            </div>
            <div class="input-group full-width">
                <label for="catatan">Catatan / Alasan</label>
                <textarea id="catatan" rows="3" required placeholder="Contoh: Tidak ada kendaraan, ban bocor, sakit"></textarea>
            </div>
        </div>

        <button type="submit" id="btnSubmit">Simpan Laporan Piket</button>
    </form>
    
    <div id="statusMsg"></div>
</div>

<script src="option-kelas-nama-nis.js"></script>
<script>
// Handler Pengiriman Formulir Laporan Piket ke Google Sheets (POST)
document.getElementById('piketForm').addEventListener('submit', async function(e) {
    e.preventDefault(); 

    const btnSubmit = document.getElementById('btnSubmit');
    const statusMsg = document.getElementById('statusMsg');

    btnSubmit.disabled = true;
    btnSubmit.innerText = 'Sedang Menyimpan Laporan...';
    statusMsg.style.display = 'none';
    
    const sekarang = new Date();
    const formatTanggal = `${sekarang.getFullYear()}-${(sekarang.getMonth() + 1).toString().padStart(2, '0')}-${sekarang.getDate().toString().padStart(2, '0')}`;
    const formatWaktu = sekarang.toTimeString().split(' ')[0];

    const payloadData = {
        kelas_nama_nis: document.getElementById('kelas_nama_nis').value,
        tanggal: formatTanggal,
        waktu: formatWaktu,
        keterangan: document.getElementById('keterangan').value,
        catatan: document.getElementById('catatan').value
    };

    try {
        const response = await fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors', 
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payloadData)
        });

        statusMsg.style.display = 'block';
        statusMsg.className = 'success';
        statusMsg.innerText = 'Sukses! Laporan piket berhasil direkam di Google Spreadsheet.';
        
        document.getElementById('piketForm').reset();
    } catch (error) {
        statusMsg.style.display = 'block';
        statusMsg.className = 'error';
        statusMsg.innerText = 'Gagal menyimpan laporan: ' + error.message;
    } finally {
        btnSubmit.disabled = false;
        btnSubmit.innerText = 'Simpan Laporan Piket';
    }
});
</script>

</body>
</html>
